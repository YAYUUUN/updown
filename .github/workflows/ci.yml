name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4  # runs the web demo's JavaScript against Python in tests/test_web.py
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline; the transformer test is skipped without torch)
        run: python -m pytest -q
      - name: Evaluator audit on synthetic data
        run: python -m updown auditoria
